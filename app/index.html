<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kate Pulse Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Tokens matched to the Kate Coins screenshot (approximation, swap for official brand values if you have them) */
:root{
  --navy:#0E3A66; --navy2:#1C5C96; --blue:#0097DB; --blue-soft:#E3F3FB; --bg:#F3F6F9; --card:#FFFFFF;
  --text:#14304F; --muted:#6B7C8F; --line:#E1E7EE;
  --warn:#E07B00; --warn-soft:#FFF2E0; --ok:#1E8E5A; --ok-soft:#E3F5EC;
  --font:"Nunito Sans", "Segoe UI", Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--text);background:#DDE3EA;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:600px){
  body{display:grid;place-items:center;padding:24px}
  .app{width:390px;height:min(844px,calc(100vh - 48px));border-radius:40px;border:10px solid #0B1A28;box-shadow:0 30px 60px -20px rgba(0,30,60,.45)}
}
.demo{background:#0B1A28;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;font-size:12px}
.demo .t{flex:1;min-width:0}
.demo .t b{display:block;font-size:12.5px}
.demo .t span{opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo button{background:rgba(255,255,255,.12);border:0;border-radius:8px;width:32px;height:32px;cursor:pointer;color:#fff;font-size:15px}
.demo button:disabled{opacity:.3}
.persona{display:flex;gap:6px;padding:0 12px 10px;background:#0B1A28}
.persona button{flex:1;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:8px;padding:6px 4px;font-size:12px;cursor:pointer}
.persona button.on{background:#fff;color:#0B1A28;font-weight:700}
.hdr{background:#fff;color:var(--navy)}
.bar3{padding:12px 14px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center}
.back{background:none;border:0;color:var(--blue);font-size:26px;padding:0;cursor:pointer;line-height:1;justify-self:start}
.bar3 h1{font-size:16px;font-weight:700;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icons{display:flex;gap:8px;justify-self:end}
.ic{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:800;background:none;padding:0;cursor:pointer}
.seg{display:flex;gap:22px;background:#fff;padding:0 18px;border-bottom:1px solid var(--line)}
.seg button{background:none;border:0;padding:10px 0 9px;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.seg button.on{color:var(--navy);font-weight:700;border-bottom-color:var(--blue)}
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.main>*{flex-shrink:0}
.main.fwd{animation:fwd .22s ease both}.main.bwd{animation:bwd .22s ease both}
@keyframes fwd{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes bwd{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.card{background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--line)}
.h2{font-size:20px;font-weight:800;color:var(--navy);margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--blue-soft);color:#0077B3;align-self:flex-start}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.btn{display:block;width:100%;border:0;border-radius:8px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--blue);color:#fff;cursor:pointer;text-align:center}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn:focus-visible,.tab:focus-visible,.demo button:focus-visible,.li:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{background:linear-gradient(110deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .top{display:flex;gap:12px;align-items:center}
.hero small{opacity:.85;font-size:12.5px}
.hero .big{font-size:19px;font-weight:800;line-height:1.25}
.hero .chip{background:rgba(255,255,255,.16);color:#fff}
.hero .btn{background:#fff;color:var(--navy)}
.kate-av{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#7FDBFF,var(--blue) 55%,#0079C1);box-shadow:0 0 0 3px rgba(255,255,255,.18);flex:none}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 0}
.sechead b{font-size:16px;color:var(--navy)}
.sechead a,.lnk{font-size:13px;color:var(--blue);font-weight:700;cursor:pointer}
.askbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px 14px;color:var(--muted);font-size:14px;cursor:pointer}
.askbar .kate-av{width:22px;height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;background:var(--blue-soft);color:var(--navy);border:0;border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.status3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--card);border-radius:10px;padding:12px 8px;text-align:center;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;border:1px solid var(--line)}
.st i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 6px;background:var(--ok)}
.st i.w{background:var(--warn)}
.st small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.list{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;cursor:pointer}
.li:last-child{border-bottom:0}
div.li{cursor:default}
.li .ico{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.li .ico.ok{background:var(--ok);color:#fff}.li .ico.w{background:var(--warn-soft);color:var(--warn)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;color:var(--navy);font-size:14.5px}
.li .tx span{display:block;color:var(--muted);font-size:12.5px}
.li .am{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.li .am.pos{color:var(--ok)}
.li .chev{color:var(--blue);font-size:20px;font-weight:700}
.li .tag{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#0077B3;background:var(--blue-soft);padding:1px 8px;border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0;padding-bottom:0}.kv:first-child{padding-top:0}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right;color:var(--navy)}
.kv small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.sig{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sig:last-child{border-bottom:0;padding-bottom:0}.sig:first-child{padding-top:0}
.sig div{flex:1;font-size:14px}
.sig small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.tg{width:44px;height:26px;border-radius:99px;background:var(--blue);border:0;position:relative;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:21px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tg[aria-checked="false"]{background:#C5CED8}.tg[aria-checked="false"]::after{left:3px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--blue)}
.big-amount{font-size:34px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.quiet{text-align:center;color:var(--muted);font-size:13px;padding:6px 12px;margin:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:18px;font-weight:700;cursor:pointer}
.radio{display:flex;gap:8px}
.radio button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 8px;cursor:pointer;text-align:left;font-size:13px;color:var(--muted)}
.radio button b{display:block;color:var(--navy);font-size:14px}
.radio button.on{border-color:var(--blue);background:var(--blue-soft)}
.msg{max-width:85%;padding:11px 14px;border-radius:14px;font-size:14.5px}
.msg.k{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;align-self:flex-start}
.msg.u{background:var(--navy);color:#fff;border-radius:14px 14px 4px 14px;align-self:flex-end}
.msg a{color:var(--blue);font-weight:700;cursor:pointer;display:inline-block;margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.opts button.pri{background:var(--navy);color:#fff}
.guide{display:flex;align-items:center;gap:10px;background:#fff;border:0;border-top:1px solid var(--line);padding:10px 14px;cursor:pointer;width:100%;text-align:left}
.guide .kate-av{width:30px;height:30px}
.guide div{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.guide b{display:block;color:var(--navy);font-size:14px}
.guide .go{color:var(--blue);font-size:22px;font-weight:700}
.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 8px)}
.tab{flex:1;background:none;border:0;padding:6px 2px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--navy);font-weight:700}
.snav{display:flex;gap:10px;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.snav button{flex:1;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:14px 6px;font-size:17px;font-weight:800;cursor:pointer}
.snav button.pri{background:var(--navy);color:#fff}
.snav button.on{box-shadow:inset 0 -4px 0 var(--blue)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;box-shadow:0 10px 24px -8px rgba(0,30,60,.5);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:5}
.toast.show{transform:none;opacity:1}
.disclaimer{text-align:center;font-size:11px;color:var(--muted);padding:4px 0 0;margin:0}
/* Simple mode: big type, one thing per screen, no menus */
.simple .main{padding:20px;gap:16px;font-size:19px;line-height:1.5}
.simple .bigq{font-size:27px;font-weight:800;color:var(--navy);line-height:1.2;margin:0}
.simple .card{padding:20px;border-width:2px}
.simple .card p{margin:0}
.simple .btn{font-size:20px;padding:18px;border-radius:12px}
.simple .btn.sec{border-width:2px}
.simple .kv{font-size:17px;padding:14px 0}
.simple .kv small{font-size:14px}
.simple .bar3 h1{font-size:20px}
.simple .li{padding:16px}.simple .li .tx b{font-size:18px}.simple .li .tx span{font-size:15px}.simple .li .am{font-size:18px}
.okbig{display:flex;gap:14px;align-items:center}
.okbig i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:800}
.okbig i.w{background:var(--warn)}
.bigpick{display:grid;gap:12px}
.bigpick button{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;font-size:19px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left}
.bigpick .ini{width:48px;height:48px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;font-size:18px;flex:none}
.bigpick.grid3{grid-template-columns:repeat(3,1fr)}
.bigpick.grid3 button{justify-content:center;font-size:22px;padding:22px 6px}
.fun{display:grid;gap:8px}
.fun .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.fun .r b{color:var(--navy);font-variant-numeric:tabular-nums;text-align:right}
.fun .r .bar{grid-column:1/-1;margin:0;height:6px}
.fun .r .bar i.w{background:var(--warn)}.fun .r .bar i.g{background:var(--ok)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:20px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:10.5px;color:var(--muted)}
.cols i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.cols.spike i{background:var(--warn)}
.lane{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lane:last-child{border-bottom:0;padding-bottom:0}.lane:first-child{padding-top:0}
.lane .when{font-weight:800;color:var(--navy);min-width:64px;font-variant-numeric:tabular-nums}
.lane p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.chk{display:flex;gap:10px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0;padding-bottom:0}.chk:first-child{padding-top:0}
.chk i{font-style:normal;color:var(--ok);font-weight:800}
.chk span{color:var(--muted);display:block;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="demo" aria-live="polite">
    <button id="prev" aria-label="Previous demo step">‹</button>
    <div class="t"><b id="dt"></b><span id="dd"></span></div>
    <button id="next" aria-label="Next demo step">›</button>
  </div>
  <div class="persona" id="persona">
    <button data-p="sarah">Sarah, 31 · savvy</button>
    <button data-p="jos">Jos, 76 · simple</button>
    <button data-p="kbc">KBC · 2.3M scale</button>
  </div>
  <div class="hdr" id="hdr"></div>
  <main class="main" id="main"></main>
  <div id="guide"></div>
  <nav id="tabs"></nav>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="../engine/output/pulse-data.js"></script>
<script>
/* State: what the engine would hold per customer */
const S = {
  persona:'sarah', stack:['kate'],
  confirmed:false, signals:{checkin:true,notary:true,sim:true,gap:true,peers:true},
  notForMe:false, insured:false, waterExtra:false, booked:null, budget:2, layout:'full',
  chat:[], jAnswered:false, payTo:null, payAmt:null, jPaid:false
};
const $ = id => document.getElementById(id);
const eur = n => '€' + n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  acc:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>',
  kate:'<circle cx="12" cy="12" r="8"/><path d="M9 11h.01M15 11h.01M9 15c1.5 1 4.5 1 6 0"/>',
  me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>'
};
/* Confidence comes from the engine output (engine/output/pulse-data.js) when present */
const ENG = window.PULSE && window.PULSE.customers;
function conf(){
  if(ENG && ENG.sarah.topMoment){
    const sigs = S.confirmed ? ENG.sarah.afterConfirm.signals : ENG.sarah.topMoment.signals;
    let c=0; for(const s of sigs) if(S.signals[s.id]!==false) c+=s.weight; return Math.round(Math.min(.99,c)*100);
  }
  if(!S.confirmed) return 62;
  const w={checkin:40,notary:22,sim:15,gap:10,peers:5}; let c=0; for(const k in w) if(S.signals[k]) c+=w[k]; return c; }
const engStamp = () => ENG ? `<p class="quiet">Calculated by the Pulse engine · ${new Date(window.PULSE.generatedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</p>` : '';
const openTasks = () => [!S.insured, !S.booked, !S.notForMe].filter(Boolean).length;
const li = (go, ico, title, sub, right='<span class="chev">›</span>', icoCls='') =>
  `<button class="li" data-go="${go}"><span class="ico ${icoCls}">${ico}</span><span class="tx"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span>${right}</button>`;
const seg = on => `<div class="seg">${[['home','Overview'],['plan','My plan'],['why','Why this']].map(([k,l])=>`<button class="${k===on?'on':''}" data-root="${k}">${l}</button>`).join('')}</div>`;
const sig = (k,label,src) => `<div class="sig"><div>${label}<small>${src}</small></div><button class="tg" role="switch" aria-checked="${S.signals[k]}" aria-label="Use: ${label}" data-sig="${k}"></button></div>`;
const kateNote = (title, text, extra='') => `<div class="card" style="display:flex;gap:12px"><span class="kate-av" style="width:28px;height:28px"></span><div><b style="color:var(--navy)">${title}</b><p class="sub" style="margin-top:4px">${text}</p>${extra}</div></div>`;

const TX = [
  {id:'t1',d:'28 Sep',n:'Colruyt Gent',a:-64.20,c:'Groceries'},
  {id:'t2',d:'27 Sep',n:'Salary · UZ Gent',a:2640.00,c:'Income'},
  {id:'t3',d:'25 Sep',n:'Rent · Lievenslaan 14',a:-890.00,c:'Housing',k:'Ends after your move',x:'After 12 Nov this rent stops. Kate will remind you to cancel it, so it doesn’t keep running.'},
  {id:'t4',d:'19 Sep',n:'IKEA Gent',a:-412.50,c:'Home',k:'Linked to your move',x:'Kate counts this towards your moving budget.'},
  {id:'t5',d:'2 Sep',n:'Notary Van Damme',a:-10000.00,c:'Home purchase',k:'Deposit for your flat',x:'Kate linked this payment to your home purchase. It’s one of the signals behind your moving plan.'},
  {id:'t6',d:'1 Sep',n:'Netflix',a:-13.99,c:'Subscriptions'}
];

/* Pages: Sarah (full layout, Kate as guide) */
const P = {
home:()=>({t:'Kate', tab:'home', seg:'home', b:`
  <div class="askbar" data-root="kate"><span class="kate-av" aria-hidden="true"></span>Ask Kate or jump to…</div>
  <div class="chips"><button data-go="quote1">Home quote</button><button data-root="plan">Moving plan</button><button data-go="account">Transactions</button><button data-go="settings">Notifications</button></div>
  <div class="hero">
    <div class="top"><div class="kate-av" aria-hidden="true"></div><div><small>Good evening, Sarah</small><div style="font-weight:700">${openTasks()?'Kate has 1 thing for you':'You’re all set'}</div></div></div>
    <span class="chip">Your move · 6 weeks to go</span>
    <div class="big">${openTasks()? `${openTasks()} ${openTasks()===1?'thing':'things'} to sort before you sign the deed` : 'Everything for your move is sorted'}</div>
    <small>${openTasks()? (S.insured?'Only your blindspot is left. About 2 minutes.':'One of them you may have missed. It takes about 4 minutes.') : 'Kate goes quiet until after your move.'}</small>
    <button class="btn" data-root="plan">See my moving plan</button>
  </div>
  <div class="sechead"><b>Your picture</b><a data-root="me">Show all</a></div>
  <div class="status3">
    <button class="st" data-go="account"><i></i>Daily money<small>on track</small></button>

 ]};
let dir='fwd', demoIdx=0;

function root(k){dir='fwd';S.stack=[k];render()}
function back(){if(S.stack.length>1){dir='bwd';S.stack.pop();render()}}
const page = k => { const [key,arg]=k.split(':'); return P[key](arg); };

function render(){

  const m=$('main'); m.className='main'; void m.offsetWidth; m.className='main '+dir; m.innerHTML=v.b; m.scrollTop=0;
  // Kate guide bar (full layout only)
  let g='';
  if(!simple && S.confirmed && !['kate','quote1','quote2','quote3','advisor','advisor_done'].includes(key)){

function demoStep(delta){
  const D=DEMOS[S.persona]; demoIdx=Math.max(0,Math.min(D.length-1,demoIdx+delta));

  dir=delta<0?'bwd':'fwd'; S.stack=[...D[demoIdx].s]; render();
}


/* Scale simulation: streams 2.3M synthetic customers through the same decision rules */
function runSim(){
  let seed=20260930; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const N=2300000, c={N,signal:0,silent:0,ask:0,held:0,act:0,fraud:0,advisor:0,optout:0}, band=[0,0,0], bandAct=[0,0,0], slots=[0,0,0,0,0];
  const slotP=[.14,.18,.16,.34,.18]; // learned best moments: 7-9, 12-14, 17-19, 19-21, 21-23
  const t0=performance.now();
  for(let i=0;i<N;i++){
    const u=rnd(), b=u<.28?0:u<.66?1:2; band[b]++;
    if(rnd()<.0008){c.fraud++;continue}              // real-time lane
    if(rnd()>.09) continue;                           // no life-moment signal today
    c.signal++;
    let conf=.35+rnd()*.6; if(rnd()<.08){c.optout++;conf-=.15}
    if(conf<.5){c.silent++;continue}
    if(conf<.7){c.ask++;continue}
    if(rnd()<.18){c.held++;continue}                  // attention budget already used
    c.act++; bandAct[b]++; if(rnd()<.12)c.advisor++;
    let r=rnd(),k=0; while(r>slotP[k]&&k<4){r-=slotP[k];k++} slots[k]++;
  }
  c.ms=Math.round(performance.now()-t0); c.band=band; c.bandAct=bandAct; c.slots=slots; return c;
}
function opsResult(){
  const c=S.sim, n=x=>x.toLocaleString('en-GB'), pct=(x,base=c.N)=>(100*x/base).toFixed(x/base<.01?2:1)+'%';
  const bar=(x,max,cls='')=>`<div class="bar"><i class="${cls}" style="width:${Math.max(.6,100*x/max)}%"></i></div>`;
  const cost=c.act*0.0006, rates=c.bandAct.map((a,i)=>a/c.band[i]), parity=Math.max(...rates)/Math.min(...rates);
  const mx=Math.max(...c.slots);
  return `
  <div class="kpis">
    <div class="kpi"><b>${n(c.ms)} ms</b><span>to score 2.3M customers in this browser</span></div>
    <div class="kpi"><b>${n(Math.round(c.N/(c.ms/1000)/1000))}k/s</b><span>customers per second, one laptop core</span></div>
    <div class="kpi"><b>${pct(c.act)}</b><span>get a suggestion tonight</span></div>
    <div class="kpi"><b>€${n(Math.round(cost))}</b><span>LLM cost tonight (at €0.0006 per message)</span></div>
  </div>
  <div class="card fun">
    <b style="color:var(--navy)">From 2.3M customers to ${n(Math.round(c.act/1000))}k cards tonight</b>
    <div class="r"><span>All customers scored</span><b>${n(c.N)}</b>${bar(c.N,c.N)}</div>
    <div class="r"><span>Life-moment signal today</span><b>${n(c.signal)}</b>${bar(c.signal,c.N)}</div>
    <div class="r"><span>Stay silent (confidence &lt; 50%)</span><b>${n(c.silent)}</b>${bar(c.silent,c.N)}</div>
    <div class="r"><span>Ask a one-tap question (50–70%)</span><b>${n(c.ask)}</b>${bar(c.ask,c.N)}</div>
    <div class="r"><span>Held back: attention budget used</span><b>${n(c.held)}</b>${bar(c.held,c.N,'w')}</div>
    <div class="r"><span>Act: one card, written by the LLM</span><b>${n(c.act)}</b>${bar(c.act,c.N,'g')}</div>
    <div class="r"><span>…of which handed to an advisor</span><b>${n(c.advisor)}</b>${bar(c.advisor,c.N,'g')}</div>
    <div class="r"><span>Real-time lane: payment paused and checked</span><b>${n(c.fraud)}</b>${bar(c.fraud,c.N,'w')}</div>
  </div>
  <div class="card"><b style="color:var(--navy)">No 9:00 spike: pushes follow each customer’s learned moment</b>
    <div class="cols">${c.slots.map((v,i)=>`<div><i style="height:${100*v/mx}%"></i>${['7–9','12–14','17–19','19–21','21–23'][i]}</div>`).join('')}</div></div>
  <div class="card"><div class="kv"><span>Fairness: suggestion rate by age</span><b>${parity<1.2?'Within 20% ✓':'Check ⚠'}</b></div>
    ${['18–34','35–54','55+'].map((l,i)=>`<div class="kv"><span>${l}</span><b>${(1000*rates[i]).toFixed(1)} per 1,000</b></div>`).join('')}</div>
  <button class="btn sec" data-act="rerun">Run again</button>
  <p class="quiet">Synthetic data. Moment and cost rates are demo assumptions.</p>`;
}

document.addEventListener('click',e=>{

  if(!t) return; const d=t.dataset;
  if('back' in d) return back();
  if(d.p){S.persona=d.p;demoIdx=0;dir='fwd';S.stack=[...DEMOS[d.p][0].s];return render()}

    case'later':toast('Snoozed. Kate will bring it up after your move.');if(cur()==='joint')back();break;
    case'useful':toast('Thanks. Kate will show more like this.');break;
    case'sign':toast('Demo: opens itsme to sign.');break;
    case'edit':toast('Demo: edit the prefilled details.');break;
    case'wrongtag':toast('Thanks. Kate will relabel this and learn from it.');break;
    case'bud-':S.budget=Math.max(1,S.budget-1);render();break;
    case'bud+':S.budget=Math.min(5,S.budget+1);render();break;
    case'jyes':S.jAnswered=true;toast('Thank you. The payment will go through.');setTimeout(()=>root('jhome'),900);break;
    case'jno':S.jAnswered=true;S.stack=['jhome','jsafe'];dir='fwd';render();break;
    case'jpaynow':S.jPaid=true;S.stack=['jhome','jpaid'];dir='fwd';render();break;
    case'outcome':toast('Logged. Sarah’s picture and Kate’s next suggestion update.');break;
    case'runsim':{const b=t;b.textContent='Running…';b.disabled=true;setTimeout(()=>{S.sim=runSim();render()},30);break}
    case'rerun':S.sim=null;render();break;
    case'listen':toast('Demo: Kate reads this aloud (ElevenLabs voice).');break;
    case'callback':toast('Els will call you back today before 17:00.');break;
    case'modes':toast('Demo: switch between Simple and Full layout.');break;
  }
});
