[project]
name = "kate-engine"
version = "0.2.0"
description = "Kate engine: synthetic bank, explainable moment models, assumptions, journeys, orchestrator and the Guardian (synthetic data, simulated integrations)"
requires-python = ">=3.11"
# Runtime dependencies only: this is what the Vercel service installs.
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "lightgbm>=4.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
train = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
